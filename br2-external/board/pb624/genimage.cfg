# External microSD: SPL+U-Boot at 8 KiB, ext4 rootfs (kernel in /boot,
# extlinux), ext4 data partition for config/photos (grown to the full card
# by flash-sd.sh).  data.ext4 is made by post-image.sh.
image sdcard.img {
	hdimage {
		# rootfs is root=PARTUUID=50623624-01, whichever slot the card is in
		disk-signature = 0x50623624
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition rootfs {
		partition-type = 0x83
		bootable = "true"
		image = "rootfs.ext4"
		offset = 1M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
